name: Hello World!

on:
    push:
        branches:
            - main

jobs:
    hello_world_job:
        runs-on: ubuntu-latest
        steps:
            - name: Say Hello
              run: |
                  echo "Hello World"

    date_today:
        runs-on: ubuntu-latest
        steps:
            - name: Now it is
              run: |
                  date

    content:
        runs-on: ubuntu-latest
        steps:
            - name: Directory content
              run: |
                  ls -l