name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  # Job 0: Decide whether deployment/tagging is allowed
  evaluate_skip:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - id: check
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Commit messages: ${{ join(github.event.commits.*.message, ' | ') }}"

          if [[ "${{ github.event_name }}" == "push" ]] && \
             [[ ! "${{ join(github.event.commits.*.message, ' ') }}" =~ "#skip" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 1: Lint & Test (runs for PRs and pushes)
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: echo "Running Lint"

      - name: Test
        run: echo "Running Tests"

  # Job 2: Deploy (push to main only, no #skip)
  deploy_to_production:
    needs: [evaluate_skip, lint_and_test]
    runs-on: ubuntu-latest
    if: needs.evaluate_skip.outputs.should_deploy == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production"
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # ✅ Discord success notification
      - name: Discord Success Notification
        if: success()
        uses: rjstone/discord-webhook-notify@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: CI Bot
          severity: info
          title: "✅ Deployment Successful"
          description: "A new version has been deployed successfully."
          color: "#2ECC71"
          text: "Repository: ${{ github.repository }} | Commit: ${{ github.sha }}"
          footer: "Fullstack CI Pipeline"

      # ❌ Discord failure notification
      - name: Discord Failure Notification
        if: failure()
        uses: rjstone/discord-webhook-notify@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: CI Bot
          severity: error
          title: "❌ Deployment Failed"
          description: "The deployment failed. Please check the details below."
          color: "#E74C3C"
          text: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Commit Message: ${{ github.event.head_commit.message }}
          footer: "Fullstack CI Pipeline"

  # Job 3: Tag release (only if deploy succeeded)
  tag_release:
    needs: [evaluate_skip, deploy_to_production]
    runs-on: ubuntu-latest
    if: >
      needs.evaluate_skip.outputs.should_deploy == 'true' &&
      needs.deploy_to_production.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
