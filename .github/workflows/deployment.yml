name: Deploy to Render via Hook

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Render Deploy Hook
              if: ${{ github.event_name == 'push' }}
              env:
                RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
              run: curl -X POST "$RENDER_DEPLOY_HOOK"
